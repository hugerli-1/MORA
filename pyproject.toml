[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mora-forecast"
version = "0.1.0"
description = "Model-Output Residual Adaptation for frozen time-series forecasters"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.scripts]
mora = "mora.__main__:main"

[tool.setuptools.packages.find]
include = ["mora*"]
